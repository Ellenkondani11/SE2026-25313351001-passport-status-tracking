name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lizard bandit flake8 coverage
      - name: Django system check
        run: python manage.py check
      - name: Migration check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests and coverage
        run: coverage run --branch --source=core manage.py test && coverage report --fail-under=50
      - name: Vertical slices
        run: python manage.py verify_slices
      - name: Complexity check
        run: lizard core/api.py core/audit_chain.py core/channels.py core/lookup.py core/services.py core/views.py --CCN 10 --length 40
      - name: Lint
        run: flake8
      - name: Security scan
        run: bandit -r core -x core/migrations -ll